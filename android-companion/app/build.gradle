plugins {
    id "com.android.application"
}

android {
    namespace "ai.codex.jcccompanion"
    compileSdk 35

    defaultConfig {
        applicationId "ai.codex.jcccompanion"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }
    }

    ndkVersion "29.0.14206865"

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

dependencies {
    implementation "com.google.mlkit:text-recognition-chinese:16.0.1"
}
